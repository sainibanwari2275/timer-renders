# Salvage/finish workflow: stitches already-rendered segments from a
# previous run into the final video and publishes it to Releases.
# Run manually with the source run id and label (e.g. 60min).
name: stitch-release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source run id holding the seg-* artifacts'
        required: true
      label:
        description: 'Video label, e.g. 60min'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  stitch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          path: segs
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Stitch segments losslessly
        run: |
          ls segs/*/*.mp4 | sort -t- -k2 -n > list.txt
          cat list.txt
          sed "s/^/file '/; s/$/'/" list.txt > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy final-${{ inputs.label }}-4k.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final-${{ inputs.label }}-4k.mp4

      - name: Publish to Releases
        run: gh release create v${{ inputs.label }} final-${{ inputs.label }}-4k.mp4 --title "${{ inputs.label }} countdown 4K" --notes "Rendered in parallel segments, stitched losslessly."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
