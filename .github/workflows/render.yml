# Parallel countdown render: splits a long video into segments rendered
# concurrently on Windows runners, then stitches them losslessly.
#
# Run manually from the Actions tab with inputs:
#   total_secs: full video length in seconds (e.g. 7200 for 120 min)
#   seg_secs:   seconds per segment (900 = 15 min keeps every job well under the 6h limit)
name: render

on:
  workflow_dispatch:
    inputs:
      total_secs:
        description: 'Full video length in seconds'
        required: true
        default: '3600'
      seg_secs:
        description: 'Seconds per segment'
        required: true
        default: '900'

permissions:
  contents: write # needed to publish the finished video to Releases

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      segments: ${{ steps.calc.outputs.segments }}
      label: ${{ steps.calc.outputs.label }}
    steps:
      - id: calc
        run: |
          TOTAL=${{ inputs.total_secs }}
          SEG=${{ inputs.seg_secs }}
          N=$(( (TOTAL + SEG - 1) / SEG ))
          IDXS=$(seq 0 $((N - 1)) | jq -R . | jq -cs .)
          echo "segments=$IDXS" >> "$GITHUB_OUTPUT"
          echo "label=$(( TOTAL / 60 ))min" >> "$GITHUB_OUTPUT"

  render-seg:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        idx: ${{ fromJson(needs.plan.outputs.segments) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine + ffmpeg
        run: |
          npx --yes @veedstudio/openedit-cli install-engine weave-v0.10.2
          npx --yes @veedstudio/openedit-cli install-ffmpeg
          Add-Content $env:GITHUB_PATH (Join-Path $env:APPDATA "veed-openedit\ffmpeg\bin")

      - name: Generate segment
        run: |
          $total = ${{ inputs.total_secs }}
          $seg = ${{ inputs.seg_secs }}
          $start = ${{ matrix.idx }} * $seg
          $len = [Math]::Min($seg, $total - $start)
          node generate-segment.js $total $start $len seg

      - name: Render segment
        run: |
          $total = ${{ inputs.total_secs }}
          $seg = ${{ inputs.seg_secs }}
          $start = ${{ matrix.idx }} * $seg
          $len = [Math]::Min($seg, $total - $start)
          $eng = Join-Path $env:APPDATA "veed-openedit\engine\veed-engine-cli.exe"
          & $eng --template seg/timer.wv --record out.mp4 --width 3840 --height 2160 --fps 30 --duration $len --progress-output

      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.idx }}
          path: out.mp4
          retention-days: 1

  stitch:
    needs: [plan, render-seg]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: segs

      - name: Stitch segments losslessly
        run: |
          ls segs/*/*.mp4 | sort -t- -k2 -n > list.txt
          cat list.txt
          sed "s/^/file '/; s/$/'/" list.txt > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy final-${{ needs.plan.outputs.label }}-4k.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 final-${{ needs.plan.outputs.label }}-4k.mp4

      - name: Publish to Releases
        run: gh release create v${{ needs.plan.outputs.label }} final-${{ needs.plan.outputs.label }}-4k.mp4 --title "${{ needs.plan.outputs.label }} countdown 4K" --notes "Rendered in parallel segments, stitched losslessly."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
